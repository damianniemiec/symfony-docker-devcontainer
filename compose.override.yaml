---
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailer:
        condition: service_started
    volumes:
      - ./:/app:ro
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - var_data:/app/var
      - vendor_data:/app/vendor
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_FIX_PERMISSIONS: ${APP_FIX_PERMISSIONS:-1}
      APP_RUNTIME_UID: ${APP_RUNTIME_UID:-1000}
      APP_RUNTIME_GID: ${APP_RUNTIME_GID:-1000}
      APP_WRITABLE_PATHS: ${APP_WRITABLE_PATHS:-var vendor /data /config}
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

volumes:
  var_data:
  vendor_data:

