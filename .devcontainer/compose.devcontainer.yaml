---
services:
  workspace:
    image: ${IMAGES_PREFIX:-}app-workspace
    build:
      context: .
      dockerfile: Dockerfile
      target: workspace
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailer:
        condition: service_started
    volumes:
      - ./:/app:ro
      - var_data:/app/var
      - vendor_data:/app/vendor
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
      XDEBUG_CONFIG: client_host=host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

volumes:
  var_data:
  vendor_data:
